name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        id: build
        continue-on-error: true
        run: |
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Game tests (dedicated server)
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          gradle runGameTestServer --no-daemon 2>&1 | tee gametest.log
          exit ${PIPESTATUS[0]}

      - name: Publish jar and logs to the 'out' branch
        if: always()
        run: |
          mkdir -p publish
          cp build.log publish/ 2>/dev/null || true
          cp gametest.log publish/ 2>/dev/null || true
          cp run/logs/latest.log publish/gametest-latest.log 2>/dev/null || true
          cp -r run/crash-reports publish/ 2>/dev/null || true
          cp build/libs/*.jar publish/ 2>/dev/null || true
          {
            echo "build=${{ steps.build.outcome }}"
            echo "gametest=${{ steps.gametest.outcome }}"
            echo "commit=${{ github.sha }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > publish/STATUS.txt
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b out
          git add -A
          git commit -q -m "Build output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out

      - name: Fail the job if build or tests failed
        if: steps.build.outcome != 'success' || steps.gametest.outcome != 'success'
        run: exit 1
